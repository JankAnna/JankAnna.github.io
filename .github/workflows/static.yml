# Build PHP + CSV and deploy generated static site to GitHub Pages

name: Build and Deploy Hub

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Build static HTML from PHP
        run: |
          mkdir -p build

          php -S 127.0.0.1:8000 -t . > /tmp/php-server.log 2>&1 &
          PHP_PID=$!

          sleep 2

          curl -f http://127.0.0.1:8000/index.php -o build/index.html

          kill $PHP_PID

      - name: Copy assets and CNAME
        run: |
          cp -r assets build/assets
          cp CNAME build/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5